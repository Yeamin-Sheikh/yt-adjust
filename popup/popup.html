<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>YT Adjust Settings</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        /* Immediate zero-delay paint styles */
        html, body {
            width: 290px;
            max-height: 580px;
            background-color: #0e0e10;
            color: #f2f2f2;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color-scheme: dark;
        }
        select, option {
            color-scheme: dark;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-group">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon" aria-hidden="true"><path d="M4.93 19.07A10 10 0 1 1 19.07 19.07"/><path d="M12 12l4.5-4.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
            <h1>YT Adjust</h1>
        </div>
        <div class="header-actions">
            <button type="button" id="resetDefaultsBtn" class="reset-btn" title="Reset all settings to defaults" aria-label="Reset all settings to defaults">Reset</button>
            <span class="version">v2.4.3</span>
        </div>
    </header>

    <main class="content">
        <!-- 1. Quality -->
        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="qualitySelect">Quality</label>
                <div class="inline-controls" id="qualitySelectorRow">
                    <select id="qualitySelect" class="custom-select" aria-label="Preferred video quality">
                        <option value="highres">4K</option>
                        <option value="hd1440">1440p</option>
                        <option value="hd1080" selected>1080p</option>
                        <option value="hd720">720p</option>
                        <option value="large">480p</option>
                        <option value="auto">Auto</option>
                    </select>
                    <label class="toggle-switch">
                        <input type="checkbox" id="qualityEnabled" aria-label="Enable auto quality" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 2. SponsorBlock -->
        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="sponsorblockEnabled">SponsorBlock</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="sponsorblockEnabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="sub-settings" id="sponsorblockSettings">
                <div class="setting-subrow">
                    <label class="sub-label" for="sponsorblockNotify">Show skip toast</label>
                    <label class="toggle-switch mini">
                        <input type="checkbox" id="sponsorblockNotify" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="chips-grid">
                    <label class="chip"><input type="checkbox" value="sponsor" class="category-cb" checked><span>Sponsor</span></label>
                    <label class="chip"><input type="checkbox" value="selfpromo" class="category-cb" checked><span>Promo</span></label>
                    <label class="chip"><input type="checkbox" value="interaction" class="category-cb" checked><span>Interaction</span></label>
                    <label class="chip"><input type="checkbox" value="intro" class="category-cb"><span>Intro</span></label>
                    <label class="chip"><input type="checkbox" value="outro" class="category-cb"><span>Outro</span></label>
                    <label class="chip"><input type="checkbox" value="preview" class="category-cb"><span>Preview</span></label>
                    <label class="chip"><input type="checkbox" value="filler" class="category-cb"><span>Filler</span></label>
                    <label class="chip"><input type="checkbox" value="music_offtopic" class="category-cb"><span>Music</span></label>
                </div>
            </div>
        </section>

        <!-- 3. Volume Gestures -->
        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="volumeGestureEnabled">Volume Gesture <small>(Right-click + Scroll)</small></label>
                <label class="toggle-switch">
                    <input type="checkbox" id="volumeGestureEnabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="sub-settings" id="volumeSettings">
                <div class="slider-row">
                    <label class="sub-label" for="volumeStep">Step</label>
                    <input type="range" id="volumeStep" min="1" max="10" step="1" value="5" class="custom-slider">
                    <span id="volumeStepValue" class="value-display">5%</span>
                </div>
            </div>
        </section>

        <!-- 4. Speed Control -->
        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="speedStep">Speed Control <small>(Shift + Scroll)</small></label>
                <div class="inline-controls" id="speedSelectorRow">
                    <select id="speedStep" class="custom-select" aria-label="Playback speed step">
                        <option value="0.1">0.1x</option>
                        <option value="0.25" selected>0.25x</option>
                        <option value="0.5">0.5x</option>
                    </select>
                    <label class="toggle-switch">
                        <input type="checkbox" id="speedControlEnabled" aria-label="Enable speed control" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 5. Boost & Mini Player -->
        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="volumeBoostLevel">Volume Boost</label>
                <div class="inline-controls" id="boostSelectorRow">
                    <select id="volumeBoostLevel" class="custom-select" aria-label="Volume boost level">
                        <option value="1.5" selected>150%</option>
                        <option value="2">200%</option>
                        <option value="3">300%</option>
                    </select>
                    <label class="toggle-switch">
                        <input type="checkbox" id="volumeBoostEnabled" aria-label="Enable volume boost" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="miniPlayerEnabled">Scroll Mini-Player</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="miniPlayerEnabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <!-- 7. Picture-in-Picture -->
        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="pipEnabled">Picture-in-Picture <small>(Alt+P)</small></label>
                <label class="toggle-switch">
                    <input type="checkbox" id="pipEnabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="sub-settings" id="pipSettings">
                <div class="setting-subrow">
                    <label class="sub-label" for="pipAutoOnTabSwitch">Auto-PiP on tab switch</label>
                    <label class="toggle-switch mini">
                        <input type="checkbox" id="pipAutoOnTabSwitch" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 8. Pause Other Tabs -->
        <section class="group">
            <div class="setting-row">
                <label class="setting-label" for="pauseOtherTabsEnabled">Pause Other Tabs <small>(Single Audio)</small></label>
                <label class="toggle-switch">
                    <input type="checkbox" id="pauseOtherTabsEnabled">
                    <span class="slider"></span>
                </label>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="brand">Sheikh Technology LLC</div>
        <div class="attribution">SponsorBlock data by sponsor.ajay.app</div>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
